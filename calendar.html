<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PitchBoard — Calendrier Ligue 1</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pitch: { 500: '#0ea5e9', 600: '#0284c7', 950: '#082f49' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col pb-12">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-200 bg-white/90 backdrop-blur sticky top-0 z-50 shadow-xs">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2.5">
                <img src="logo.webp" alt="PitchBoard Logo" class="h-9 w-auto object-contain">
                <span class="font-extrabold text-base tracking-tight text-slate-900">Pitch<span class="text-sky-600">Board</span></span>
            </a>
            <nav class="flex items-center gap-2">
                <a href="index.html" class="text-xs font-semibold text-slate-600 px-3 py-1.5 rounded-lg hover:bg-slate-100">Accueil</a>
                <a href="classement.html" class="text-xs font-semibold text-slate-600 px-3 py-1.5 rounded-lg hover:bg-slate-100">Classement</a>
                <a href="calendar.html" class="text-xs font-bold bg-slate-900 text-white px-3 py-1.5 rounded-lg">Calendrier</a>
                <a href="team.html" class="text-xs font-semibold text-slate-600 px-3 py-1.5 rounded-lg hover:bg-slate-100">Équipes</a>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="max-w-5xl mx-auto px-4 pt-10 pb-6 text-center space-y-4">
        <div class="inline-flex items-center gap-2 bg-sky-500/10 border border-sky-500/20 px-3.5 py-1.5 rounded-full text-xs font-bold text-sky-600">
            <i data-lucide="calendar" class="w-3.5 h-3.5"></i> Saison 2026/2027
        </div>
        <h2 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900">
            Calendrier & <span class="text-sky-600">Résultats</span>
        </h2>
    </section>

    <!-- Main Content Container -->
    <main class="max-w-3xl w-full mx-auto px-4 mt-2 flex-1 space-y-4">
        
        <!-- Sélecteur de Journée -->
        <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3">
            <label for="matchdaySelect" class="font-bold text-xs text-slate-700 flex items-center gap-2">
                <i data-lucide="filter" class="w-4 h-4 text-sky-600"></i> Choisir une journée :
            </label>
            <select id="matchdaySelect" class="bg-slate-50 border border-slate-200 text-slate-800 text-xs font-semibold rounded-xl px-4 py-2 outline-none focus:border-sky-500 transition cursor-pointer w-full sm:w-auto">
                <!-- Les options seront générées en JS -->
            </select>
        </div>

        <!-- Liste des matchs de la journée sélectionnée -->
        <div id="matchesContainer" class="space-y-3">
            <div class="bg-white border border-slate-200 rounded-2xl p-6 text-center text-slate-400 text-xs italic">
                Chargement du calendrier...
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 bg-white py-8 text-center text-xs text-slate-400 mt-16">
        <p class="font-bold text-slate-600 mb-1">PitchBoard — Football Analytics</p>
        <p>© 2026 PitchBoard. Tous droits réservés.</p>
    </footer>

    <!-- Moteur JS -->
    <script>
        lucide.createIcons();

        const API_KEY = ' e69838debdd944ce98f16a61295e0305'; // Remplace par ta clé API
        let allMatches = [];

        async function loadCalendar() {
            try {
                const response = await fetch('https://api.football-data.org/v4/competitions/FL1/matches', {
                    headers: { 'X-Auth-Token': API_KEY }
                });
                if (!response.ok) throw new Error("Erreur chargement calendrier");

                const data = await response.json();
                allMatches = data.matches;

                // Trouver toutes les journées uniques disponibles
                const matchdays = [...new Set(allMatches.map(m => m.matchday))].sort((a, b) => a - b);
                
                const selectElement = document.getElementById('matchdaySelect');
                selectElement.innerHTML = '';

                // Trouver le premier match à venir (TIMED) pour sélectionner sa journée par défaut
                let defaultMatchday = matchdays[0];
                const nextMatch = allMatches.find(m => m.status === 'TIMED' || m.status === 'SCHEDULED');
                if (nextMatch) {
                    defaultMatchday = nextMatch.matchday;
                }

                // Remplir le menu déroulant
                matchdays.forEach(day => {
                    const option = document.createElement('option');
                    option.value = day;
                    option.textContent = `Journée ${day}`;
                    if (day === defaultMatchday) {
                        option.selected = true;
                    }
                    selectElement.appendChild(option);
                });

                // Afficher les matchs de la journée sélectionnée par défaut
                displayMatches(defaultMatchday);

                // Écouter le changement de sélection dans le menu
                selectElement.addEventListener('change', (e) => {
                    displayMatches(parseInt(e.target.value));
                });

            } catch (error) {
                console.error("Erreur :", error);
                document.getElementById('matchesContainer').innerHTML = `
                    <div class="bg-white border border-slate-200 rounded-2xl p-6 text-center text-amber-600 text-xs font-semibold">
                        ⚠️ Erreur lors du chargement des matchs du calendrier.
                    </div>
                `;
            }
        }

        function displayMatches(matchday) {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '';

            // Filtrer les matchs de la journée choisie
            const filteredMatches = allMatches.filter(m => m.matchday === matchday);

            if (filteredMatches.length === 0) {
                container.innerHTML = `<div class="bg-white border border-slate-200 rounded-2xl p-6 text-center text-slate-400 text-xs italic">Aucun match trouvé pour cette journée.</div>`;
                return;
            }

            filteredMatches.forEach(match => {
                const matchDate = new Date(match.utcDate);
                const options = { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' };
                const formattedDate = matchDate.toLocaleDateString('fr-FR', options);

                let statusBadge = '';
                let scoreDisplay = '';

                if (match.status === 'FINISHED') {
                    statusBadge = `<span class="bg-slate-100 text-slate-600 font-bold px-2 py-0.5 rounded text-[10px]">Terminé</span>`;
                    scoreDisplay = `<span class="text-base font-extrabold text-slate-900">${match.score.fullTime.home} - ${match.score.fullTime.away}</span>`;
                } else if (match.status === 'IN_PLAY' || match.status === 'PAUSED') {
                    statusBadge = `<span class="bg-emerald-500 text-white font-bold px-2 py-0.5 rounded text-[10px] animate-pulse">En direct</span>`;
                    scoreDisplay = `<span class="text-base font-extrabold text-emerald-600">${match.score.fullTime.home} - ${match.score.fullTime.away}</span>`;
                } else {
                    statusBadge = `<span class="bg-sky-50 text-sky-600 font-bold px-2 py-0.5 rounded text-[10px]">À venir</span>`;
                    scoreDisplay = `<span class="text-xs font-bold text-slate-400 bg-slate-50 px-2.5 py-1 rounded-lg border border-slate-100">VS</span>`;
                }

                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-2xl p-4 shadow-sm hover:border-sky-300 transition space-y-3";
                card.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-100 pb-2 text-[11px] text-slate-500 font-semibold">
                        <span class="capitalize flex items-center gap-1.5"><i data-lucide="clock" class="w-3.5 h-3.5 text-sky-600"></i> ${formattedDate}</span>
                        ${statusBadge}
                    </div>
                    <div class="flex items-center justify-between py-1">
                        <!-- Équipe Domicile -->
                        <div class="flex items-center gap-3 w-2/5">
                            <img src="${match.homeTeam.crest || ''}" alt="" class="w-7 h-7 object-contain shrink-0">
                            <span class="font-bold text-slate-900 text-xs sm:text-sm truncate">${match.homeTeam.name}</span>
                        </div>
                        <!-- Score ou VS -->
                        <div class="w-1/5 text-center flex justify-center">
                            ${scoreDisplay}
                        </div>
                        <!-- Équipe Extérieur -->
                        <div class="flex items-center gap-3 w-2/5 justify-end text-right">
                            <span class="font-bold text-slate-900 text-xs sm:text-sm truncate">${match.awayTeam.name}</span>
                            <img src="${match.awayTeam.crest || ''}" alt="" class="w-7 h-7 object-contain shrink-0">
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            lucide.createIcons();
        }

        loadCalendar();
    </script>
</body>
</html>
